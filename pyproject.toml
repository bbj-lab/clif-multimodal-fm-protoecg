[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clif-protoecg-fm"
version = "0.1.0"
description = "Multi-modal foundation model: CLIF clinical data + ECG prototypes"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20",
    "pyarrow>=14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "torch>=2.0",
    "transformers>=4.36",
    "scikit-learn>=1.3",
    "typer>=0.9",
    "rich>=13.0",
    "matplotlib>=3.7",
    "clifpy>=0.3.9",
]

[project.optional-dependencies]
sglang = ["sglang[all]>=0.4"]
wandb = ["wandb>=0.16"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
protoecg-pipeline = "clif_protoecg.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clif_protoecg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
